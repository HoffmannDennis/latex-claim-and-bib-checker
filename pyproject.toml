[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "latex-claim-and-bib-checker"
dynamic = ["version"]
description = "Check a LaTeX manuscript: citation consistency, BibTeX metadata against Crossref, OpenAlex and DataCite, and whether cited abstracts support the citing sentences."
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Dennis Hoffmann" }]
keywords = ["latex", "bibtex", "references", "citations", "abstracts", "crossref", "openalex", "datacite", "llm"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "requests>=2.28",
    "bibtexparser>=1.4,<2",
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/HoffmannDennis/latex-claim-and-bib-checker"
Source = "https://github.com/HoffmannDennis/latex-claim-and-bib-checker"

[project.scripts]
latex-claim-and-bib-checker = "latex_claim_and_bib_checker._cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.version]
path = "src/latex_claim_and_bib_checker/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/latex_claim_and_bib_checker"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "examples/",
    "README.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
